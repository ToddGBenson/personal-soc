name: guard

# Fails the build if a confidential personal profile/ledger is ever committed.
# Complements GitHub's native secret scanning (which catches known token formats).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-personal-data:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable, so `@v4` is a
      # promise from whoever can move it rather than a fixed input to this
      # build. Every other workflow in this estate pins this way; this file
      # was the only exception.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Ensure no filled profile/identifier ledger is tracked
        run: |
          hits="$(git ls-files | grep -E '(^|/)(profile|identifiers)\.md$' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Confidential personal file is tracked — only *.example.md may be committed:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no profile.md / identifiers.md tracked (templates only)"
